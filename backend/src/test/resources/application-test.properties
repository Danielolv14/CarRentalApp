# Perfil dos testes de API: banco H2 em memória no lugar do Supabase
spring.datasource.url=jdbc:h2:mem:testes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.segredo=segredo-so-para-testes-com-mais-de-32-caracteres
