spring.application.name=aluguel-carros

# Lê o arquivo backend/.env (copie de .env.example). Variáveis de ambiente do sistema têm prioridade.
spring.config.import=optional:file:.env[.properties]

# Banco de dados: Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Token de login (JWT HS256). O segredo precisa ter pelo menos 32 caracteres.
app.jwt.segredo=${JWT_SECRET:}
app.jwt.validade-horas=${JWT_VALIDADE_HORAS:8}

# Origem do front-end (Vite) liberada no CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
